[package]
name = "symfony-zed"
version = "0.1.0"
edition = "2021"
authors = ["Symfony Zed contributors"]
license = "MIT"
description = "Symfony framework intelligence for Zed"

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"

[workspace]
members = ["symfony-lsp"]
resolver = "2"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true

[profile.release.package.symfony-lsp]
opt-level = 3
